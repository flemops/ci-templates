name: Valider et taguer (réutilisable)

# Appelé en workflow_call par le prod-tag.yml de chaque dépôt applicatif.
# Ne connaît rien de la VM : il valide (install + lint + tests) et, si ça
# passe, déplace un tag sur le commit validé. Aucun secret d'accès à une VM
# n'est manipulé ici — voir deploy/cd/ pour la moitié « pull » côté serveur.

on:
  workflow_call:
    inputs:
      runtime:
        description: "node ou python"
        required: true
        type: string
      version:
        description: "Version passée à setup-node / setup-python"
        required: true
        type: string
      install_cmd:
        description: "Commande d'installation des dépendances"
        required: true
        type: string
      test_cmd:
        description: "Commande de test (obligatoire — sans elle le tag ne prouve rien)"
        required: true
        type: string
      lint_cmd:
        description: "Commande de lint, optionnelle"
        required: false
        type: string
        default: ""
      tag_name:
        description: "Nom du tag déplacé après succès"
        required: false
        type: string
        default: "prod"
      tag_prod:
        description: "Déplacer le tag même hors push (workflow_dispatch)"
        required: false
        type: boolean
        default: false
      prod_install_cmd:
        description: >-
          Optionnel. À renseigner UNIQUEMENT si install_cmd installe plus que
          ce que la VM installera en production (ex. requirements-dev.txt
          avec pytest, alors que la VM fait pip install -r requirements.txt).
          Rejoue cette commande dans un venv isolé, vide autrement — sert de
          filet pour prod_check_cmd. Laisser vide si install_cmd == les deps
          de prod exactement (rien à isoler).
        required: false
        type: string
        default: ""
      prod_check_cmd:
        description: >-
          Commande exécutée juste après prod_install_cmd dans le même venv
          isolé (ex. un import Python qui déclenche tous les imports de
          l'app). Prouve qu'aucun import de code applicatif ne dépend d'un
          paquet présent seulement en CI (dev/test) — un devDependency non
          détecté ici passerait la CI et casserait la VM, où le rollback
          serait le seul filet. Ignoré si prod_install_cmd est vide.
        required: false
        type: string
        default: ""

permissions:
  contents: write

# Groupe borné au dépôt appelant : deux dépôts différents ne se bloquent
# jamais entre eux ; deux push rapprochés sur le même dépôt s'attendent au
# lieu de s'annuler (un commit validé ne doit jamais rester promu après un
# commit plus récent resté en file). Le contexte `inputs` n'est pas
# disponible au niveau `concurrency:` d'un reusable workflow (échec de
# validation du fichier, aucun job créé) — seul `github.*` l'est ici.
concurrency:
  group: valider-et-taguer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  valider:
    runs-on: ubuntu-latest
    # Sans plafond, un test qui boucle (ou attend un réseau qui ne répond
    # jamais) consommerait des minutes Actions indéfiniment au lieu
    # d'échouer proprement.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - if: inputs.runtime == 'node'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.version }}
          cache: npm

      - if: inputs.runtime == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.version }}
          cache: pip

      - name: Dépendances
        run: ${{ inputs.install_cmd }}

      - name: Lint
        if: inputs.lint_cmd != ''
        run: ${{ inputs.lint_cmd }}

      - name: Tests
        run: ${{ inputs.test_cmd }}

      - name: Vérifie que les dépendances de PRODUCTION seules suffisent
        if: inputs.prod_install_cmd != ''
        # venv isolé : install_cmd a déjà pu installer des paquets de
        # dev/test dans l'environnement système, qui masqueraient
        # exactement le défaut que cette étape cherche à détecter.
        run: |
          set -eu
          python3 -m venv /tmp/verif-prod-deps
          export PATH="/tmp/verif-prod-deps/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          ${{ inputs.prod_install_cmd }}
          ${{ inputs.prod_check_cmd }}

      - name: Déplacer le tag
        if: github.event_name == 'push' || inputs.tag_prod
        run: |
          set -eu
          git tag --force "${{ inputs.tag_name }}" "$GITHUB_SHA"
          git push --force origin "refs/tags/${{ inputs.tag_name }}"
          echo "tag ${{ inputs.tag_name }} -> $GITHUB_SHA"
