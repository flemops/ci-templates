name: Automation baseline (reusable)

on:
  workflow_call:
    inputs:
      ecosystem:
        description: "node | python | docs"
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: "22"
      python_version:
        required: false
        type: string
        default: "3.12"
      install_cmd:
        required: false
        type: string
        default: ""
      lint_cmd:
        required: false
        type: string
        default: ""
      test_cmd:
        required: false
        type: string
        default: ""
      build_cmd:
        required: false
        type: string
        default: ""
      audit_cmd:
        required: false
        type: string
        default: ""
      enable_secret_scan:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: automation-baseline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality baseline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - if: inputs.ecosystem == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - if: inputs.ecosystem == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install
        if: inputs.install_cmd != ''
        run: ${{ inputs.install_cmd }}

      - name: Lint
        if: inputs.lint_cmd != ''
        run: ${{ inputs.lint_cmd }}

      - name: Test
        if: inputs.test_cmd != ''
        run: ${{ inputs.test_cmd }}

      - name: Build
        if: inputs.build_cmd != ''
        run: ${{ inputs.build_cmd }}

      - name: Dependency audit
        if: inputs.audit_cmd != ''
        run: ${{ inputs.audit_cmd }}

  secrets:
    name: Secret scan
    if: inputs.enable_secret_scan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
